name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: vigneshsindhe
          outputs: |
            output/snake-dark.svg?palette=github-dark&color_snake=#00FF00&color_dots=#000000,#001100,#003300,#006600,#00CC00
            output/snake-light.svg?palette=github-dark&color_snake=#00FF00&color_dots=#000000,#001100,#003300,#006600,#00CC00

      - name: Push to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🐍 Update contribution snake [skip ci]"
          file_pattern: "output/snake*.svg"
          branch: main